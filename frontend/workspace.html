<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ContextIQ Workspace — Ask questions grounded in your uploaded documents.">
  <title>Workspace — ContextIQ</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ==================== MOBILE HEADER ==================== -->
  <div class="mobile-header">
    <button class="hamburger btn-icon" id="mobileMenuBtn" aria-label="Open menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <span class="mobile-brand">ContextIQ</span>
  </div>

  <!-- ==================== SIDEBAR OVERLAY ==================== -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ==================== SIDEBAR ==================== -->
  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Sidebar navigation">
    <div class="sidebar-header">
      <a href="index.html" class="sidebar-logo-icon" aria-label="ContextIQ Home">C</a>
      <div class="sidebar-logo-text">
        <a href="index.html" class="brand">ContextIQ</a>
        <div class="subtitle">AI Assistant</div>
      </div>
    </div>

    <button class="sidebar-new-chat" id="newChatBtn" aria-label="Start new chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Chat
    </button>

    <nav class="sidebar-nav">
      <a href="workspace.html" class="sidebar-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg>
        Workspace
      </a>
      <a href="knowledge-base.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
        Knowledge Base
      </a>

      <div class="sidebar-section-title">Recent Chats</div>
      <div id="recentChats">
        <!-- Populated by JS -->
      </div>

      <div class="sidebar-section-title" style="margin-top:8px;">Settings</div>
      <a href="#" class="sidebar-link" onclick="return false;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Settings
      </a>
    </nav>

    <div class="sidebar-bottom">
      <a href="#" class="sidebar-link" onclick="return false;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Help Center
      </a>
      <a href="index.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Log Out
      </a>
    </div>
  </aside>

  <!-- ==================== MAIN CONTENT ==================== -->
  <div class="main-content">
    <div class="chat-container">

      <!-- Trust Banner -->
      <div class="trust-banner">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        Answers are generated only from the available documents
      </div>

      <!-- Empty State -->
      <div class="empty-state" id="emptyState">
        <h2>How can ContextIQ help you today?</h2>
        <div class="suggested-questions" id="suggestedQuestions">
          <button class="suggested-q" data-question="What are the attendance requirements?">What are the attendance requirements?</button>
          <button class="suggested-q" data-question="Explain the examination rules.">Explain the examination rules.</button>
          <button class="suggested-q" data-question="What documents are required for admission?">What documents are required for admission?</button>
          <button class="suggested-q" data-question="Tell me about the academic policies.">Tell me about the academic policies.</button>
        </div>
      </div>

      <!-- Messages Area -->
      <div class="messages-area" id="messagesArea" style="display:none;"></div>

    </div>

    <!-- Chat Composer -->
    <div class="chat-composer">
      <div class="composer-inner">
        <textarea class="composer-input" id="chatInput" placeholder="Ask anything about your documents..." rows="1" aria-label="Type your message"></textarea>
        <button class="send-btn" id="sendBtn" disabled aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>

[project]
name = "clean-rag-chatbot"
version = "0.1.0"
description = "Document-grounded PDF question-answering assistant"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "instructor",
    "langchain",
    "langchain-community",
    "langchain-classic",
    "langchain-google-genai",
    "langchain-groq",
    "langchain-huggingface",
    "langchain-mongodb",
    "langchain-ollama",
    "langchain-text-splitters",
    "nest-asyncio",
    "numpy",
    "ollama",
    "openai",
    "pandas",
    "pymongo",
    "pymupdf",
    "python-docx",
    "python-dotenv",
    "rank-bm25",
    "ragas",
    "scikit-learn",
    "sentence-transformers",
    "streamlit",
    "tiktoken",
    "torch",
    "transformers",
    "torchvision",
]

[tool.uv]
package = false
